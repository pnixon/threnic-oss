[package]
name = "wgsl-compat"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "WGSL to GLSL ES 3.00 translation for Threnic's WebGL2 compatibility backend (naga compiled to WebAssembly)"

[lib]
crate-type = ["cdylib"]

[dependencies]
naga = { version = "30", default-features = false, features = ["wgsl-in", "glsl-out"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
