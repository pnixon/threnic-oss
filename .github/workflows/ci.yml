name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check-format
      - run: npx tsc --noEmit -p .
      - run: npx vitest run
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  gpu:
    name: Rendering tests (WebGPU, WebGL2, Firefox)
    runs-on: ubuntu-latest
    # The runners have no graphics card, so both browsers render in software.
    # Informational until the reference images are known to hold there too.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - run: npm run test:gpu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-test-report
          path: playwright-report-gpu
          retention-days: 7

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    # Optional: a failing image build doesn't block the main check.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: docker build .
        env:
          DOCKER_BUILDKIT: 1
